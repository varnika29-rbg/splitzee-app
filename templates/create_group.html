<!DOCTYPE html>
<html>
<head>

    <title>Splitzee | Create Group</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;

            background-image: url("{{ url_for('static', filename='app-bg.jpeg') }}");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;

            background-color: #2bb6a8;
            color: #333;
        }


        /* ================= PAGE ================= */

        .page-wrapper {
            min-height: 100vh;
            padding: 30px 15px 40px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .create-container {
            width: 100%;
            max-width: 520px;
        }


        /* ================= TOP BAR ================= */

        .top-bar {
            background: rgba(255,255,255,0.96);

            border-radius: 22px;

            padding: 17px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow: 0 10px 30px rgba(0,0,0,0.18);

            margin-bottom: 16px;
        }

        .brand {
            font-size: 23px;
            font-weight: bold;
            color: #1b2b7a;
        }

        .brand span {
            color: #2bb6a8;
        }

        .back-top {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            background: #e7f7f5;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            font-size: 19px;
        }


        /* ================= CARD ================= */

        .create-card {
            background: white;

            border-radius: 25px;

            padding: 28px 24px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.18);

            text-align: center;
        }


        /* ================= HEADER ================= */

        .create-icon {
            width: 70px;
            height: 70px;

            border-radius: 22px;

            background: #e7f7f5;

            margin: 0 auto 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 34px;
        }

        .create-card h2 {
            margin: 0;

            color: #1b2b7a;

            font-size: 25px;
        }

        .subtitle {
            margin-top: 7px;

            color: #777;

            font-size: 13px;

            line-height: 1.5;
        }


        /* ================= FORM ================= */

        .form-group {
            margin-top: 24px;

            text-align: left;
        }

        .form-label {
            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: bold;

            color: #333;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 14px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 18px;

            pointer-events: none;
        }

        input {
            width: 100%;

            padding: 14px 14px 14px 45px;

            border-radius: 14px;

            border: 1px solid #ddd;

            background: #fafafa;

            color: #333;

            font-size: 14px;

            outline: none;

            transition: border 0.2s ease,
                        box-shadow 0.2s ease,
                        background 0.2s ease;
        }

        input:focus {
            border-color: #2bb6a8;

            background: white;

            box-shadow: 0 0 0 3px rgba(43,182,168,0.12);
        }

        input::placeholder {
            color: #999;
        }


        /* ================= BUTTON ================= */

        .create-btn {
            width: 100%;

            min-height: 50px;

            margin-top: 20px;

            border: none;

            border-radius: 26px;

            background: #2bb6a8;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: transform 0.15s ease,
                        box-shadow 0.15s ease;
        }

        .create-btn:hover {
            transform: translateY(-2px);

            box-shadow: 0 6px 18px rgba(43,182,168,0.3);
        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .page-wrapper {
                padding: 12px 10px 25px;
            }

            .top-bar {
                padding: 14px 16px;

                border-radius: 18px;
            }

            .brand {
                font-size: 21px;
            }

            .create-card {
                padding: 24px 17px;

                border-radius: 20px;
            }

            .create-card h2 {
                font-size: 22px;
            }

        }

    </style>

</head>


<body>

<div class="page-wrapper">

    <div class="create-container">


        <!-- TOP BAR -->

        <div class="top-bar">

            <div class="brand">
                Split<span>zee</span>
            </div>

            <a
                href="/groups"
                class="back-top"
                title="Back to Groups">
                ←
            </a>

        </div>


        <!-- CREATE CARD -->

        <div class="create-card">


            <!-- HEADER -->

            <div class="create-icon">
                🧳
            </div>

            <h2>
                Create Trip
            </h2>

            <div class="subtitle">
                Start a new trip and invite your friends to split expenses together.
            </div>


            <!-- FORM -->

            <form method="POST">

                <div class="form-group">

                    <label
                        class="form-label"
                        for="trip_name">

                        Trip Name

                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ✈️
                        </span>

                        <input
                            id="trip_name"
                            type="text"
                            name="trip_name"
                            placeholder="e.g. Goa, Manali, College Trip"
                            required>

                    </div>

                </div>


                <button
                    type="submit"
                    class="create-btn">

                    ✨ Create Group

                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
